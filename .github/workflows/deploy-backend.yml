name: 🚀 Deploy — Backend (Oracle Cloud)

on:
  # Manual trigger with configurable options
  workflow_dispatch:
    inputs:
      service:
        description: "Which service(s) to deploy?"
        required: true
        default: "both"
        type: choice
        options:
          - api
          - worker
          - both
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  deploy-backend:
    name: Deploy ${{ github.event.inputs.service }} to Oracle Cloud
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.ORACLE_HOST }}" ]; then
            echo "❌ ORACLE_HOST secret is not set. Aborting."
            exit 1
          fi
          echo "✅ Secrets validated."

      - name: Deploy API only
        if: github.event.inputs.service == 'api'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/SystemMapper
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build api
            docker image prune -f
            echo "✅ API deployed successfully."

      - name: Deploy Worker only
        if: github.event.inputs.service == 'worker'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/SystemMapper
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build worker
            docker image prune -f
            echo "✅ Worker deployed successfully."

      - name: Deploy API + Worker (both)
        if: github.event.inputs.service == 'both'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/SystemMapper
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build api worker
            docker image prune -f
            echo "✅ API + Worker deployed successfully."
