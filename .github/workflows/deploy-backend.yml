name: 🚀 Deploy — Backend (Oracle Cloud via GHCR)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service(s) to build and deploy?"
        required: true
        default: "both"
        type: choice
        options:
          - api
          - worker
          - both
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image(s) to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        id: repo
        run: |
          echo "owner_lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push API Image
        if: github.event.inputs.service == 'api' || github.event.inputs.service == 'both'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.owner_lowercase }}/systemmapper-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker Image
        if: github.event.inputs.service == 'worker' || github.event.inputs.service == 'both'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.owner_lowercase }}/systemmapper-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-oracle:
    name: Deploy to Oracle Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.ORACLE_HOST }}" ]; then
            echo "❌ ORACLE_HOST secret is not set. Aborting."
            exit 1
          fi
          echo "✅ Secrets validated."

      - name: Copy Compose file to Oracle (No Source Code)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/SystemMapper"

      - name: SSH & Deploy Pre-built Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            mkdir -p ~/SystemMapper
            cd ~/SystemMapper
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "✅ 100% Zero-Source-Code Way B Deployment Successful!"
