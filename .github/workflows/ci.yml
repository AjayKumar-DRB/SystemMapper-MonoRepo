name: ✅ CI — Lint, Format, Type-check & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 1: Prettier format check
      # Fails the build if any file is not formatted correctly
      - name: ✨ Format check (Prettier)
        run: pnpm format:check

      # Step 2: ESLint — strict rules, zero warnings tolerated
      # --max-warnings=0 means even a single warning fails the build
      - name: 🔍 Lint (ESLint)
        run: pnpm turbo run lint -- --max-warnings=0

      # Step 3: TypeScript type check across all packages
      - name: 🔷 Type check (TypeScript)
        run: pnpm turbo run type-check

      # Step 4: Build all packages and apps
      # If any package fails to compile, the whole pipeline fails
      - name: 🔨 Build
        run: pnpm turbo run build
